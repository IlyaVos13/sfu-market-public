name: API checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'docs/**', 'feature/**']
permissions:
  contents: read
jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet build backend/SfuMarket.Api -c Release
      - run: python tests/check_health.py
